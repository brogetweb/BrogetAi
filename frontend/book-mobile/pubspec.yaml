name: broget_book
description: "Book by Broget AI — flights, buses, and hotels."
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#0B1F3A"
    theme_color: "#0066FF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
